<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filly Technology Logo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap');

    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Montserrat', sans-serif;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      min-width: 460px;
    }

    /* Top Row: Icon + FILLY */
    .brand-main {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    /* F logo mark, cropped from the original artwork */
    .f-mark {
      height: 74px;
      width: auto;
      display: block;
      flex-shrink: 0;
    }

    /* Wordmark: FILLY */
    .brand-name {
      color: #ffffff;
      font-family: "Montserrat", sans-serif;
      font-size: 5rem;
      font-weight: 300;
      letter-spacing: 0.4rem;
      line-height: 1;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
    }

    /* Subtitle: TECHNOLOGY with flanking lines */
    .brand-subtitle {
      display: flex;
      align-items: center;
      width: 100%;
      margin-top: 1rem;
    }

    .brand-subtitle::before,
    .brand-subtitle::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #1d4ed8, #3b82f6);
    }

    .subtitle-text {
      color: #3b82f6;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.65rem;
      padding: 0 1.2rem;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
